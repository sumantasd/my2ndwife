<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 700" width="2000" height="700">
  <defs>
    <!-- Background Gradient (Warm Peach & Amber Sunset) -->
    <linearGradient id="bgRolls" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="80%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#1F1F39"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="glowRolls" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1F1F39" stop-opacity="0"/>
    </radialGradient>

    <!-- Dropshadow -->
    <filter id="shadowRolls" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="2000" height="700" fill="url(#bgRolls)"/>
  <rect width="2000" height="700" fill="url(#glowRolls)"/>

  <!-- Decorative Shapes -->
  <circle cx="1650" cy="350" r="420" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="1650" cy="350" r="300" fill="#FFFFFF" opacity="0.03"/>

  <!-- Left Content: Promotional Typography & Elements -->
  <g transform="translate(140, 150)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="360" height="44" rx="22" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="26" cy="22" r="7" fill="#FDE047"/>
    <text x="48" y="28" font-family="'Rubik', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" letter-spacing="3">SAVORY &amp; SATISFYING</text>

    <!-- Offer Badge -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="310" height="52" rx="26" fill="#FDE047"/>
      <text x="28" y="35" font-family="'Rubik', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="24" fill="#1F1F39" letter-spacing="1">FLAT 15% OFF</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="195" font-family="'Rubik', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="58" fill="#FFFFFF" letter-spacing="-1">
      Kolkata Kathi Rolls &amp; Kebabs
    </text>

    <!-- Subtitle -->
    <text x="0" y="250" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="24" fill="#FFFFFF" opacity="0.9">
      Crispy flaky layered parathas wrapped with juicy tandoori chicken, crunchy onions &amp; zesty lime.
    </text>

    <!-- CTA & Delivery Info -->
    <g transform="translate(0, 290)">
      <!-- Order Now Button -->
      <rect x="0" y="0" width="220" height="60" rx="30" fill="#FFFFFF" filter="url(#shadowRolls)"/>
      <text x="50" y="38" font-family="'Rubik', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="#C2410C">Order Now →</text>

      <!-- Delivery Promise -->
      <g transform="translate(260, 20)">
        <circle cx="16" cy="12" r="16" fill="#10B981"/>
        <path d="M10 12 L15 17 L23 8" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="45" y="18" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">Fresh Off The Tawa in 30 Mins</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Kathi Roll Graphic -->
  <g transform="translate(1500, 360)" filter="url(#shadowRolls)">
    <!-- Wooden Board Base -->
    <rect x="-350" y="-120" width="700" height="240" rx="40" fill="#78350F" stroke="#451A03" stroke-width="5"/>
    <rect x="-340" y="-110" width="680" height="220" rx="30" fill="#92400E"/>

    <!-- Roll 1 (Golden Paratha Wrap) -->
    <g transform="translate(-140, -10) rotate(-18)">
      <rect x="-160" y="-45" width="320" height="90" rx="45" fill="#FDE047" stroke="#D97706" stroke-width="4"/>
      <!-- Brown Roasted Paratha Spots -->
      <circle cx="-100" cy="-15" r="12" fill="#B45309" opacity="0.6"/>
      <circle cx="-40" cy="10" r="16" fill="#B45309" opacity="0.6"/>
      <circle cx="30" cy="-20" r="14" fill="#B45309" opacity="0.6"/>
      <circle cx="80" cy="15" r="10" fill="#B45309" opacity="0.6"/>
      <!-- Paper Wrapping -->
      <rect x="-60" y="-46" width="130" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="-60" y1="0" x2="70" y2="0" stroke="#E2E8F0" stroke-width="3"/>
      <!-- Filling Peeking Out -->
      <ellipse cx="140" cy="0" rx="30" ry="40" fill="#78350F"/>
      <circle cx="145" cy="-10" r="12" fill="#16A34A"/>
      <circle cx="150" cy="12" r="14" fill="#DC2626"/>
      <circle cx="138" cy="5" r="8" fill="#FFFFFF"/>
    </g>

    <!-- Roll 2 (Second Kathi Roll) -->
    <g transform="translate(120, 25) rotate(12)">
      <rect x="-160" y="-45" width="320" height="90" rx="45" fill="#FDE047" stroke="#D97706" stroke-width="4"/>
      <circle cx="-90" cy="10" r="14" fill="#B45309" opacity="0.6"/>
      <circle cx="-20" cy="-15" r="12" fill="#B45309" opacity="0.6"/>
      <circle cx="50" cy="12" r="15" fill="#B45309" opacity="0.6"/>
      <!-- Paper Wrapping -->
      <rect x="-60" y="-46" width="130" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Filling Peeking Out -->
      <ellipse cx="-140" cy="0" rx="30" ry="40" fill="#78350F"/>
      <circle cx="-145" cy="-8" r="12" fill="#16A34A"/>
      <circle cx="-150" cy="10" r="14" fill="#DC2626"/>
    </g>
  </g>
</svg>
